name: Publicar Compás

on:
  push:
    branches: [main, master, codex/import-chord-sheet, codex/chord-diagnostics, codex/interactive-practice]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar producción
        uses: actions/checkout@v6
        with:
          ref: master
          path: production
      - name: Descargar vista previa del importador
        uses: actions/checkout@v6
        with:
          ref: codex/import-chord-sheet
          path: importer
      - name: Descargar vista previa de diagnóstico
        uses: actions/checkout@v6
        with:
          ref: codex/chord-diagnostics
          path: diagnostic
      - name: Descargar práctica interactiva
        uses: actions/checkout@v6
        with:
          ref: codex/interactive-practice
          path: interactive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar y generar producción
        working-directory: production
        run: npm run check && npm run build
      - name: Verificar y generar importador
        working-directory: importer
        run: npm run check && npm run build
      - name: Verificar y generar diagnóstico
        working-directory: diagnostic
        run: npm run check && npm run build
      - name: Verificar y generar práctica interactiva
        working-directory: interactive
        run: npm run check && npm run build
      - name: Combinar las cuatro vistas
        run: |
          mkdir -p combined/importador combined/diagnostico combined/interactivo
          cp -R production/dist/. combined/
          cp -R importer/dist/. combined/importador/
          cp -R diagnostic/dist/. combined/diagnostico/
          cp -R interactive/dist/. combined/interactivo/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: combined

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
